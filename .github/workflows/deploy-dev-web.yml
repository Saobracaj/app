name: Build & Deploy web (dev)

# Dev-окружение: собирает веб-бандл из ветки `develop` и выкатывает его на
# https://saobracaj-dev.gleb.at (сервис `web-dev` в compose-стеке бэкенда на
# том же VPS, где прод). Цель сборки — та же lib/main_prod.dart: окружение
# приложение выбирает в рантайме по домену, dev-домен сам смотрит на
# api.saobracaj-dev.gleb.at.
#
# Как и в проде (см. память о порядке деплоя): веб катится только после
# зелёных analyze/test, чтобы dev-домен не остался со сломанным клиентом.
on:
  push:
    branches: [develop]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.7'
  FLUTTER_TARGET: 'lib/main_prod.dart'

concurrency:
  group: deploy-web-dev
  cancel-in-progress: false

jobs:
  checks:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Freezed/Drift/injectable/localization output is gitignored, so CI has
      # to generate it before anything compiles.
      - name: Generate code
        run: bash codegen.sh

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Test the web server
        working-directory: web_server
        run: cargo test --locked

  build-web:
    name: Build web image (dev)
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push the image to GHCR
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate code
        run: bash codegen.sh

      # Номер сборки — счётчик этого workflow со смещением, чтобы отличать
      # dev-сборки в «О приложении»; в сторы dev никогда не уходит.
      - name: Build the web bundle
        run: |
          flutter build web --wasm --release \
            --target "$FLUTTER_TARGET" \
            --build-number "$(( ${{ github.run_number }} + 100 ))" \
            --dart-define=FCM_VAPID_KEY="${{ secrets.FCM_VAPID_KEY }}"

      - name: Compute the image name (GHCR requires a lowercase owner)
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "repo=ghcr.io/${owner}/saobracaj_web" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${owner}/saobracaj_web:dev-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.repo }}:dev-${{ github.sha }}
            ${{ steps.meta.outputs.repo }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-web:
    name: Deploy web (dev)
    needs: build-web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      # Compose-файл и nginx-конфиг dev-домена — часть деплой-стека бэкенда
      # (saobracaj_backend/deploy). Здесь только пин образа web-dev и рестарт
      # одного сервиса.
      - name: Roll out on the server
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build-web.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          password: ${{ vars.VPS_SSH_PASSWORD }}
          envs: IMAGE,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            set -euo pipefail
            cd ~/app

            # Точечно пин dev-образа: остальные строки .env принадлежат
            # деплоям бэкенда (прод сохраняет DEV_WEB_IMAGE через keep_previous).
            umask 077
            touch .env
            grep -v '^DEV_WEB_IMAGE=' .env > .env.next || true
            printf 'DEV_WEB_IMAGE=%s\n' "$IMAGE" >> .env.next
            mv .env.next .env

            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin
            sudo docker compose pull web-dev
            sudo docker compose up -d web-dev
            sudo docker image prune -f
          command_timeout: 20m
