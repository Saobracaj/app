[package]
name = "saobracaj_web"
version = "0.1.0"
edition = "2021"
description = "Static server for the Flutter web build of Saobraćaj (saobracaj.gleb.at)"
publish = false

[[bin]]
name = "saobracaj_web"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "compression-br"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
