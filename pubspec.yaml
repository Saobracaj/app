name: saobracaj
description: "Вежбање испитних теоријских питања из саобраћаја у Србији."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.1.0+4

environment:
  sdk: ^3.8.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.9
  dio: ^5.10.0
  connectivity_plus: ^6.1.5
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.5
  flutter_bloc: ^9.1.1
  routemaster: ^1.1.1
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  path_provider: ^2.1.5
  path: ^1.9.1
  confetti: ^0.8.0
  get_time_ago: ^2.4.0
  package_info_plus: ^10.2.1
  flutter_markdown: ^0.7.7+1
  url_launcher: ^6.3.2
  easy_localization: ^3.0.8
  easy_localization_loader: ^2.0.2
  # Direct dependency for DateFormat in the attempts analysis; the version is
  # already pinned transitively by easy_localization.
  intl: ^0.20.2
  scrollable_positioned_list: ^0.3.8
  collection: ^1.19.0
  rxdart: ^0.28.0
  http: ^1.2.2
  flutter_svg: ^2.0.0

  # Firebase social sign-in (Google / Apple). Requires a Firebase project bound
  # to this app: run `flutterfire configure` to (re)generate lib/firebase_options.dart
  # and the platform config (google-services.json / GoogleService-Info.plist).
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  firebase_ui_auth: ^3.0.0
  firebase_ui_oauth: ^2.0.0
  firebase_ui_oauth_google: ^2.0.0
  firebase_ui_oauth_apple: ^2.0.0
  google_sign_in: ^6.3.0
  get_it: ^9.2.1
  injectable: ^3.0.0
  dynamic_color: ^1.8.1
  # Requesting the OS notification permission for the push toggle (see
  # lib/notifications/). Mirrors owncup's notification-permission handling.
  permission_handler: ^12.0.3
  firebase_messaging: ^16.4.3
  # Usage analytics (lib/core/analytics/): screen views + a few key events.
  # Rides on the Firebase project that is already configured for sign-in and
  # push; fails soft like the rest of the Firebase stack.
  # Group invitations (lib/groups/): the QR code an owner shows is *generated*
  # here — there is no scanner in the app, a phone's own camera reads it.
  qr_flutter: ^4.1.0
  # The share sheet for an invite link (the code and the link are also
  # copyable, so sharing never becomes the only way out).
  share_plus: ^13.3.0
  # Incoming links (lib/core/deep_links/): an invite opened from a chat has to
  # land inside the app, not in a browser tab. Handles both the verified
  # https://saobracaj.gleb.at/... links and the saobracaj:// scheme.
  app_links: ^6.4.1
  # GraphQL subscriptions (lib/auth/data/graphql_subscription_client.dart): the
  # group feed keeps itself up to date over a websocket. Was already present
  # transitively; listed here because the app now talks the protocol itself.
  web_socket_channel: ^3.0.3
  # Picking an attachment for the support chat (lib/support_chat/). The
  # flutter.dev package rather than file_picker: the latter pins win32 ^5, which
  # cannot coexist with share_plus/package_info_plus here.
  file_selector: ^1.1.0
  # Выбор фотографии из системной галереи для чата (пункт «Фотография» меню
  # вложений). file_selector открывает файловый менеджер, а не галерею, поэтому
  # для фото нужен именно image_picker.
  image_picker: ^1.1.2
  # Пережатие фотографий в JPEG на устройстве (lib/support_chat/data/
  # photo_compressor.dart). Чистый Dart — работает и в wasm-вебе, где
  # image_picker игнорирует imageQuality.
  image: ^4.5.4
  restart_app: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  drift_dev: ^2.34.0
  injectable_generator: ^3.0.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
     - assets/img/
     - assets/allQuestions.json
     - assets/allQuestions_ru.json
     - assets/categories.json
     - assets/practice.json
     # Derived from the two above by tool/question_analytics.py — re-run it when
     # either changes.
     - assets/question_analytics.json
     - assets/translations/
     - assets/dict/
     - assets/parsed_zakon.json
     - assets/md_img/

  # Inter, bundled rather than fetched at runtime: the quiz works offline, so
  # the type has to as well. Covers Latin, Serbian Latin and Cyrillic.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
